
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          mkdir -p project
          find . -maxdepth 1 -type f -iname '*.zip' -print -quit | grep -q . || {
            echo "ERROR: No project ZIP file found"
            exit 1
          }
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          unzip -o "$ZIP_FILE" -d project

      - name: Find Android project
        id: find_project
        run: |
          FILE=$(find project -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$FILE" ]; then
            echo "No Android Gradle project found in ZIP."
            echo "A web HTML app needs to be converted to Android first."
            exit 1
          fi
          if [ "$(basename "$FILE")" = "gradlew" ]; then
            DIR=$(dirname "$FILE")
          else
            DIR=$(dirname "$FILE")
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: .
        run: |
          cd "${{ steps.find_project.outputs.dir }}"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worksites-app-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
