name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d project

      - name: Build debug APK
        run: |
          PROJECT_DIR=$(find project -type f -name settings.gradle -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Android project files not found"
            exit 1
          fi
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worksites-app-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
